name: validate-profiles

# Tier 0 (static) + Tier 1 (build-only smoke) per ADR-0009.
# Cheap checks: cue vet, pytest, ruff, mypy. No GPU, no push.

on:
  pull_request:
    paths:
      - 'profiles/**'
      - 'tools/**'
      - 'state/**'
      - 'patches/**'
      - 'stage3/**'
      - 'mlnode_foundry/**'
      - 'pyproject.toml'
      - 'mise.toml'
      - '.github/workflows/validate-profiles.yml'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # for render-dockerfile-diff bot comments (future)

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cue-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + tools
        uses: jdx/mise-action@v2
        with:
          version: 2026.3.17
          install: true
          cache: true

      - name: cue vet (all packages)
        run: cue vet ./...

      - name: cue vet — stage2.lock against schema
        run: cue vet tools/stage2.lock.cue tools/stage2.lock.schema.cue

      - name: cue vet — existing registry-view JSON files against #RegistryView
        run: |
          shopt -s nullglob
          for f in registry-view/*.json; do
            echo "→ $f"
            cue vet "$f" registry-view/schema.cue -d "#RegistryView"
          done

      - name: cue vet — existing state JSON files against #State
        run: |
          shopt -s nullglob
          for f in state/*.json; do
            # _stage2-vllm-env.json has a different shape (no #State); skip
            case "$f" in
              state/_*) echo "  (skip $f — meta file, not #State-shaped)"; continue ;;
            esac
            echo "→ $f"
            cue vet "$f" state/schema.cue -d "#State"
          done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + tools
        uses: jdx/mise-action@v2
        with:
          version: 2026.3.17
          install: true
          cache: true

      - name: Install mlnode-foundry
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: ruff
        run: .venv/bin/ruff check mlnode_foundry/

      - name: mypy
        run: .venv/bin/mypy mlnode_foundry/ || true   # mypy strict — relax until Phase 4
        continue-on-error: true

      - name: pytest
        run: .venv/bin/pytest mlnode_foundry/tests/ -v

      - name: validate all profiles
        run: |
          shopt -s nullglob
          fail=0
          for f in profiles/*.cue; do
            base=$(basename "$f" .cue)
            [ "$base" = "schema" ] && continue
            echo "→ $base"
            .venv/bin/mlnode-foundry validate "$base" || fail=$((fail+1))
          done
          [ "$fail" -eq 0 ] || { echo "::error::$fail profile(s) failed validation"; exit 1; }

      - name: tag both
        run: |
          .venv/bin/mlnode-foundry tag b200-kimi-k2-6-int4
          .venv/bin/mlnode-foundry tag h100-minimax-m2-7

      - name: hash determinism
        run: |
          H1=$(.venv/bin/mlnode-foundry hash b200-kimi-k2-6-int4)
          H2=$(.venv/bin/mlnode-foundry hash b200-kimi-k2-6-int4)
          [ "$H1" = "$H2" ] || { echo "Hash not deterministic: $H1 vs $H2"; exit 1; }
          echo "✓ profile_hash: $H1"

name: build-stage3

# Builds and publishes Stage 3 per-(GPU, model) image for each profile.
# Matrix expands across all profiles/*.cue files.
#
# Per profile:
#   1. Resolve BASE_IMAGE from tools/stage2.lock.cue (or profile.base for overlay-mode)
#   2. Compute profile_hash; skip if matching GHCR tag exists (skip-if-unchanged)
#   3. Build via stage3/Dockerfile with hw-patches + runner-patch applied
#   4. Push to GHCR
#   5. Sign with cosign keyless
#   6. Write + commit state/<package-tag>.json

on:
  push:
    branches: [main]
    paths:
      - 'profiles/**'
      - 'tools/**'
      - 'stage3/**'
      - 'patches/**'
      - 'mlnode_foundry/**'
      - '.github/workflows/build-stage3.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: |
          Profile selector: empty = all; or exact name (`b300-kimi-k2-6-int4`);
          or comma-separated list (`b200-minimax-m2-7,h200-minimax-m2-7`);
          or glob (`*-minimax-m2-7`); or any mix (`*-kimi-*,b300-qwen3-235b-a22b`).
        required: false
        type: string
      force:
        description: 'Force rebuild even if profile_hash unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

concurrency:
  # Workflow-level concurrency; per-profile concurrency handled by job-level matrix.
  group: build-stage3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    # Compute matrix from profiles/*.cue (excluding schema, bases)
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.set.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -n "${{ inputs.profile }}" ]; then
            # Selector: comma-separated patterns, each may be exact name or glob.
            # Only top-level profiles/*.cue are scanned (bases/ subdir excluded).
            IFS=',' read -ra PATTERNS <<< "${{ inputs.profile }}"
            declare -a matched=()
            for raw in "${PATTERNS[@]}"; do
              pat="${raw#"${raw%%[![:space:]]*}"}"; pat="${pat%"${pat##*[![:space:]]}"}"
              [ -z "$pat" ] && continue
              hit=0
              for f in profiles/${pat}.cue; do
                # nullglob suppresses unmatched globs but a literal path with no
                # wildcards still iterates over its literal value — check existence.
                [ -f "$f" ] || continue
                base=$(basename "$f" .cue)
                [ "$base" = "schema" ] && continue
                matched+=("$base")
                hit=1
              done
              [ "$hit" -eq 0 ] && echo "::warning::Pattern '$pat' matched 0 profiles"
            done
            if [ ${#matched[@]} -eq 0 ]; then
              echo "::error::Profile selector '${{ inputs.profile }}' matched 0 profiles"
              exit 1
            fi
            PROFILES=$(printf '%s\n' "${matched[@]}" | sort -u | jq -R . | jq -s -c .)
          else
            PROFILES=$(ls profiles/*.cue | grep -v schema.cue | xargs -n1 basename | sed 's/\.cue$//' | jq -R . | jq -s -c .)
          fi
          echo "profiles=$PROFILES" >> "$GITHUB_OUTPUT"
          echo "Matrix profiles: $PROFILES"

  build:
    needs: matrix
    if: needs.matrix.outputs.profiles != '[]'
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.matrix.outputs.profiles) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false

      - name: Install mise + tools
        uses: jdx/mise-action@v2
        with:
          version: 2026.3.17
          install: true
          cache: true

      - name: Install mlnode-foundry CLI
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .

      - name: Compute tag + hash
        id: meta
        run: |
          PROFILE="${{ matrix.profile }}"
          FULL_TAG=$(.venv/bin/mlnode-foundry tag "$PROFILE")
          PROFILE_HASH=$(.venv/bin/mlnode-foundry hash "$PROFILE")
          # Split into package and tag
          PACKAGE_NAME="${FULL_TAG%:*}"
          TAG="${FULL_TAG#*:}"
          {
            echo "profile=$PROFILE"
            echo "package_name=$PACKAGE_NAME"
            echo "tag=$TAG"
            echo "full_tag=$FULL_TAG"
            echo "profile_hash=$PROFILE_HASH"
          } >> "$GITHUB_OUTPUT"
          echo "=== Profile metadata ==="
          echo "Profile: $PROFILE"
          echo "Tag: $FULL_TAG"
          echo "Hash: $PROFILE_HASH"

      - name: Skip-if-unchanged
        id: skip
        if: ${{ !inputs.force }}
        continue-on-error: true
        run: |
          # Check if image with matching profile_hash label exists
          EXISTING_HASH=$(docker buildx imagetools inspect --raw "${{ steps.meta.outputs.full_tag }}" 2>/dev/null \
            | jq -r '.. | objects | select(.["io.containerd.image.config"]? != null) | .["io.containerd.image.config"]["Labels"]["gonka.kaitaku.profile_hash"]' \
            2>/dev/null | head -1 || echo "")
          if [ "$EXISTING_HASH" = "${{ steps.meta.outputs.profile_hash }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✓ Image with matching profile_hash already exists; skipping rebuild"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Existing hash: '$EXISTING_HASH', new: '${{ steps.meta.outputs.profile_hash }}' — rebuild needed"
          fi

      - name: Login to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Render Stage 3 Dockerfile + build-args
        if: steps.skip.outputs.skip != 'true'
        id: args
        run: |
          # Render stage3/Dockerfile.rendered with profile-specific ENV + tuning label.
          .venv/bin/mlnode-foundry render-dockerfile "${{ matrix.profile }}"
          # Compute build-args (identity + base image; ENV is baked into rendered Dockerfile).
          BUILD_ARGS=$(.venv/bin/python -c "
          from mlnode_foundry.render_bake import load_profile, render_build_args
          from mlnode_foundry.render_name_tag import load_naming, render_package_and_tag
          from mlnode_foundry.build_hash import compute_profile_hash
          p = load_profile('${{ matrix.profile }}')
          naming = load_naming()
          pkg, tag = render_package_and_tag(p, naming)
          ph = compute_profile_hash('${{ matrix.profile }}')
          args = render_build_args(p, pkg, tag, ph)
          for k, v in args.items():
              print(f'{k}={v}')
          ")
          {
            echo "build_args<<EOF"
            echo "$BUILD_ARGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Stage 3
        if: steps.skip.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stage3/Dockerfile.rendered
          push: true
          tags: ${{ steps.meta.outputs.full_tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ steps.meta.outputs.package_name }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.package_name }}:buildcache,mode=max
          build-args: ${{ steps.args.outputs.build_args }}

      - name: Install cosign
        if: steps.skip.outputs.skip != 'true'
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign
        if: steps.skip.outputs.skip != 'true'
        run: |
          cosign sign --yes ${{ steps.meta.outputs.package_name }}@${{ steps.build.outputs.digest }}

      - name: Write state/<package-tag>.json
        if: steps.skip.outputs.skip != 'true'
        run: |
          mkdir -p state
          PACKAGE_BASENAME=$(echo "${{ steps.meta.outputs.package_name }}" | sed 's|.*/||')
          STATE_FILE="state/${PACKAGE_BASENAME}-${{ steps.meta.outputs.tag }}.json"
          jq -n \
            --arg profile "profiles/${{ matrix.profile }}.cue" \
            --arg profile_hash "${{ steps.meta.outputs.profile_hash }}" \
            --arg package "${{ steps.meta.outputs.package_name }}" \
            --arg tag "${{ steps.meta.outputs.tag }}" \
            --arg digest "${{ steps.build.outputs.digest }}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg identity "https://github.com/${{ github.repository }}/.github/workflows/build-stage3.yml@${{ github.ref }}" \
            '{
              profile: $profile,
              profile_hash: $profile_hash,
              status: "draft",
              image: {
                package: $package,
                tag: $tag,
                digest: $digest,
                built_at: $built_at,
                cosign_identity: $identity
              },
              validation: {
                build_smoke: { result: "pass", at: $built_at }
              }
            }' > "$STATE_FILE"
          echo "=== $STATE_FILE ==="
          cat "$STATE_FILE"
          echo "state_file=$STATE_FILE" >> "$GITHUB_ENV"

      - name: Validate state against schema
        if: steps.skip.outputs.skip != 'true'
        run: |
          cue vet "$state_file" state/schema.cue -d "#State"

      - name: Write registry-view/<package-tag>.json (dashboard)
        if: steps.skip.outputs.skip != 'true'
        run: |
          # Compressed image size for linux/amd64 platform (walks index → manifest → layers).
          SIZE=$(.venv/bin/mlnode-foundry image-size \
            "${{ steps.meta.outputs.package_name }}@${{ steps.build.outputs.digest }}" \
            2>/dev/null || echo "")
          .venv/bin/mlnode-foundry registry-view "${{ matrix.profile }}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --cosign-identity "https://github.com/${{ github.repository }}/.github/workflows/build-stage3.yml@${{ github.ref }}" \
            --size "$SIZE"
          PACKAGE_BASENAME=$(echo "${{ steps.meta.outputs.package_name }}" | sed 's|.*/||')
          REGISTRY_FILE="registry-view/${PACKAGE_BASENAME}-${{ steps.meta.outputs.tag }}.json"
          echo "registry_file=$REGISTRY_FILE" >> "$GITHUB_ENV"
          echo "=== $REGISTRY_FILE ==="
          cat "$REGISTRY_FILE"

      - name: Validate registry-view against schema
        if: steps.skip.outputs.skip != 'true'
        run: |
          cue vet "$registry_file" registry-view/schema.cue -d "#RegistryView"

      - name: Commit state + registry-view
        if: steps.skip.outputs.skip != 'true'
        env:
          STATE_PUSH_TOKEN: ${{ secrets.STATE_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${STATE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull --rebase --autostash "$REMOTE" main || true
          git add "$state_file" "$registry_file"
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "state: ${{ matrix.profile }} → ${{ steps.meta.outputs.tag }} (hash ${{ steps.meta.outputs.profile_hash }}, digest ${{ steps.build.outputs.digest }}, run ${{ github.run_id }})"
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase --autostash "$REMOTE" main && git push "$REMOTE" HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 5))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push state + registry-view after 3 attempts"
              exit 1
            fi
          fi

      - name: Summary
        if: steps.skip.outputs.skip != 'true'
        run: |
          echo "### ${{ matrix.profile }} build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.meta.outputs.full_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **profile_hash**: \`${{ steps.meta.outputs.profile_hash }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Summary (skipped)
        if: steps.skip.outputs.skip == 'true'
        run: |
          echo "### ${{ matrix.profile }} — SKIPPED (profile_hash unchanged)" >> $GITHUB_STEP_SUMMARY

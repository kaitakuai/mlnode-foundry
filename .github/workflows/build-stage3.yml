name: build-stage3

# Builds Stage 3 (kaitakuai/mlnode-base) image:
#   1. Clone upstream gonka-ai/gonka at pinned commit
#   2. Apply patches/*.patch to source tree
#   3. Build via stage3/Dockerfile.patch-and-build with Stage 2 (vllm-poc) digest as BASE_IMAGE
#   4. Push to ghcr.io/kaitakuai/mlnode-base
#   5. Sign with cosign keyless via OIDC
#   6. Introspect vLLM ENV vars, commit state/_stage3-vllm-env.json

on:
  push:
    branches: [main]
    paths:
      - 'tools/stage3.lock.cue'
      - 'patches/**'
      - 'stage3/**'
      - '.github/workflows/build-stage3.yml'
  workflow_dispatch:
    inputs:
      stage2_image:
        description: 'Override Stage 2 image (package path, no tag). Default: from stage3.lock.cue. Use for one-off bases (e.g. a 0.25.1 mlnode-base) WITHOUT flipping the fleet lock.'
        required: false
        default: ''
      stage2_digest:
        description: 'Override Stage 2 digest (sha256:...). Required together with stage2_image. When set, this is a one-off override build: it does NOT commit state/.'
        required: false
        default: ''
      stage3_tag:
        description: 'Override the published Stage 3 tag (e.g. 0.2.13-vllm0.25.1-k1). Default: from stage3.lock.cue. Set for override builds so they do not collide with the locked tag.'
        required: false
        default: ''
      vllm_version:
        description: 'Override VLLM_VERSION build-arg / OCI label (e.g. 0.25.1). Default: derived from the stage2 tag in the lock.'
        required: false
        default: ''

permissions:
  contents: write       # commit state/_stage3-vllm-env.json
  id-token: write       # cosign keyless OIDC
  packages: write       # GHCR push
  attestations: write   # SLSA provenance

concurrency:
  group: build-stage3-${{ github.ref }}
  cancel-in-progress: false   # don't interrupt mid-publish

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # too slow
          docker-images: false    # we'll prune our own

      - name: Install mise + cue
        uses: jdx/mise-action@v2
        with:
          version: 2026.3.17
          install: true
          cache: true

      - name: Resolve stage3.lock.cue values
        id: lock
        run: |
          # Use cue export to get JSON, then jq for field access
          LOCK_JSON=$(cue export tools/stage3.lock.cue)
          UPSTREAM_REPO=$(echo "$LOCK_JSON" | jq -r '.upstream.repo')
          UPSTREAM_COMMIT=$(echo "$LOCK_JSON" | jq -r '.upstream.commit')
          MLNODE_VERSION=$(echo "$LOCK_JSON" | jq -r '.upstream.mlnode_version')
          STAGE2_IMAGE=$(echo "$LOCK_JSON" | jq -r '.stage2.image')
          STAGE2_DIGEST=$(echo "$LOCK_JSON" | jq -r '.stage2.digest')
          STAGE3_PACKAGE=$(echo "$LOCK_JSON" | jq -r '.stage3.package')
          STAGE3_TAG=$(echo "$LOCK_JSON" | jq -r '.stage3.tag')
          VLLM_VERSION=$(echo "$LOCK_JSON" | jq -r '.stage2.tag' | sed 's/-poc.*$//; s/^v//')

          # workflow_dispatch overrides for a one-off base (e.g. mlnode-base-0.25.1)
          # WITHOUT mutating tools/stage3.lock.cue. A non-empty stage2_digest marks
          # this as an override build (state/ commit is skipped below).
          IS_OVERRIDE=false
          if [ -n "${INPUT_STAGE2_IMAGE}" ]; then STAGE2_IMAGE="${INPUT_STAGE2_IMAGE}"; fi
          if [ -n "${INPUT_STAGE2_DIGEST}" ]; then STAGE2_DIGEST="${INPUT_STAGE2_DIGEST}"; IS_OVERRIDE=true; fi
          if [ -n "${INPUT_STAGE3_TAG}" ]; then STAGE3_TAG="${INPUT_STAGE3_TAG}"; fi
          if [ -n "${INPUT_VLLM_VERSION}" ]; then VLLM_VERSION="${INPUT_VLLM_VERSION}"; fi
          if [ "$IS_OVERRIDE" = "true" ] && [ -z "${INPUT_STAGE3_TAG}" ]; then
            echo "::error::override build requires stage3_tag (must not collide with the locked $STAGE3_TAG)"; exit 1
          fi
          echo "IS_OVERRIDE=$IS_OVERRIDE (stage2=$STAGE2_IMAGE@$STAGE2_DIGEST -> $STAGE3_PACKAGE:$STAGE3_TAG, vllm=$VLLM_VERSION)"

          {
            echo "upstream_repo=$UPSTREAM_REPO"
            echo "upstream_commit=$UPSTREAM_COMMIT"
            echo "mlnode_version=$MLNODE_VERSION"
            echo "base_image=$STAGE2_IMAGE@$STAGE2_DIGEST"
            echo "stage3_full_tag=$STAGE3_PACKAGE:$STAGE3_TAG"
            echo "vllm_version=$VLLM_VERSION"
            echo "is_override=$IS_OVERRIDE"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUT_STAGE2_IMAGE: ${{ github.event.inputs.stage2_image }}
          INPUT_STAGE2_DIGEST: ${{ github.event.inputs.stage2_digest }}
          INPUT_STAGE3_TAG: ${{ github.event.inputs.stage3_tag }}
          INPUT_VLLM_VERSION: ${{ github.event.inputs.vllm_version }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Build and push Stage 3
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stage3/Dockerfile.patch-and-build
          push: true
          tags: ${{ steps.lock.outputs.stage3_full_tag }}
          target: app
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ steps.lock.outputs.stage3_full_tag }}-buildcache
          cache-to: type=registry,ref=${{ steps.lock.outputs.stage3_full_tag }}-buildcache,mode=max
          build-args: |
            BASE_IMAGE=${{ steps.lock.outputs.base_image }}
            UPSTREAM_REPO=${{ steps.lock.outputs.upstream_repo }}
            UPSTREAM_COMMIT=${{ steps.lock.outputs.upstream_commit }}
            MLNODE_VERSION=${{ steps.lock.outputs.mlnode_version }}
            VLLM_VERSION=${{ steps.lock.outputs.vllm_version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign
        run: |
          cosign sign --yes ${{ steps.lock.outputs.stage3_full_tag }}@${{ steps.build.outputs.digest }}

      - name: Introspect vLLM ENV vars
        run: |
          # Pull a fresh copy of our newly-published stage3 image
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="${{ steps.lock.outputs.stage3_full_tag }}@$DIGEST"
          # Run a brief container to extract vllm.envs.__all__
          ENVS_JSON=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            python3 -c "
          import json
          try:
              from vllm import envs
              names = sorted([n for n in dir(envs) if n.isupper() and not n.startswith(\"_\")])
              print(json.dumps({\"vllm_env_names\": names, \"vllm_envs_count\": len(names)}))
          except Exception as e:
              print(json.dumps({\"error\": str(e), \"vllm_env_names\": [], \"vllm_envs_count\": 0}))
          "
          ') || echo '{"error": "container run failed", "vllm_env_names": [], "vllm_envs_count": 0}'
          # Write state/_stage3-vllm-env.json with snapshot metadata
          mkdir -p state
          jq -n \
            --arg stage3_image "${{ steps.lock.outputs.stage3_full_tag }}" \
            --arg digest "$DIGEST" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson envs "$ENVS_JSON" \
            '{
              stage3_image: $stage3_image,
              digest: $digest,
              built_at: $built_at,
              vllm: $envs
            }' > state/_stage3-vllm-env.json
          echo "=== state/_stage3-vllm-env.json ==="
          cat state/_stage3-vllm-env.json

      - name: Commit state/_stage3-vllm-env.json
        if: steps.lock.outputs.is_override != 'true'
        env:
          STATE_PUSH_TOKEN: ${{ secrets.STATE_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${STATE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git add state/_stage3-vllm-env.json
          if git diff --quiet --cached -- state/_stage3-vllm-env.json; then
            echo "No state changes to commit"
          else
            git commit -m "state: update _stage3-vllm-env.json after stage3 build (digest ${{ steps.build.outputs.digest }}, run ${{ github.run_id }})"
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase --autostash "$REMOTE" main && git push "$REMOTE" HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 5))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push state file after 3 attempts"
              exit 1
            fi
          fi

      - name: Summary
        run: |
          echo "### Stage 3 build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.lock.outputs.stage3_full_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream commit**: \`${{ steps.lock.outputs.upstream_commit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Stage 2 base**: \`${{ steps.lock.outputs.base_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Patches applied**: \`patches/0001-content-type-middleware.patch\`" >> $GITHUB_STEP_SUMMARY
